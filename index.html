<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OniRLCS — Carnet de pronostics RLCS</title>
  <meta name="description" content="Carnet de pronostics RLCS d'Oni : score par événement, pronostic vs résultat, saisons 2025–2026.">
  <meta name="author" content="Yanis (Oni)">
  <meta name="theme-color" content="#1d3b4f">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="OniRLCS — Carnet de pronostics">
  <meta property="og:description" content="Pronostics RLCS 2025–2026, événement par événement.">
  <meta property="og:image" content="/img/og-preview.png">
  <meta property="og:locale" content="fr_FR">

  <link rel="icon" type="image/png" sizes="32x32" href="/img/worlds2025.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/worlds2025.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    /* Applique les réglages avant le premier rendu (évite le flash clair → sombre) */
    (function () {
      var d = document.documentElement, p = {};
      try { p = JSON.parse(localStorage.getItem('onirlcs:prefs') || '{}'); } catch (e) {}
      var t = p.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.dataset.theme = t;
      d.dataset.accent = ({blue:'ocean',violet:'plum',teal:'moss'}[p.accent]) || p.accent || 'ocean';
      d.dataset.size = p.size || 'm';
      d.dataset.grain = p.grain === true ? 'on' : 'off';
      d.dataset.motion = p.motion === false ? 'off' : 'on';
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="stylesheet" href="predict.css?v=1">
</head>
<body>
  <a class="skip-link" href="#stage">Aller au contenu</a>

  <header class="mobile-bar">
    <button type="button" class="mobile-toggle" id="mobile-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="rail">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-bar-title">Oni<span>RLCS</span></span>
    <div class="mobile-bar-tools">
      <button type="button" class="icon-btn" data-theme-quick aria-label="Changer de thème"><svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
      <button type="button" class="icon-btn" data-prefs-open aria-label="Ouvrir les réglages" aria-expanded="false" aria-controls="prefs"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h10M19 6h2M3 12h4M13 12h8M3 18h11M20 18h1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg></button>
    </div>
  </header>
  <div class="rail-backdrop" id="rail-backdrop" hidden></div>

  <div class="app-shell">

    <aside class="rail" id="rail" aria-label="Navigation">
      <button type="button" class="rail-brand rail-brand-link" id="home-link">
        <span class="rail-kicker">Rocket League Championship Series</span>
        <span class="rail-name">Oni<span>RLCS</span></span>
        <span class="rail-sub">Carnet de pronostics — 2025 → 2026</span>
        <span class="sr-only"> — retour à l'accueil</span>
      </button>

      <div class="rail-ticker" id="rail-ticker" aria-label="Statistiques globales"></div>

      <div class="season-switch" role="group" aria-label="Choisir la saison">
        <button type="button" class="season-opt" data-season="2025" aria-pressed="false">2025</button>
        <button type="button" class="season-opt" data-season="2026" aria-pressed="false">2026</button>
        <button type="button" class="season-opt" data-season="2027" aria-pressed="false">2027</button>
      </div>
      <div class="rail-search">
        <input type="search" id="event-search" class="rail-search-input" placeholder="Rechercher un événement…" aria-label="Rechercher un événement">
        <button type="button" class="rail-add" data-p="new-event">+ Pronostic manuel</button>
      </div>

      <nav class="event-list" id="event-list" aria-label="Événements de la saison"></nav>

      <div class="rail-foot">
        <button type="button" class="prefs-trigger" data-prefs-open aria-expanded="false" aria-controls="prefs"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h10M19 6h2M3 12h4M13 12h8M3 18h11M20 18h1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg><span>Réglages</span></button>
        <button type="button" class="icon-btn" data-theme-quick aria-label="Changer de thème"><svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
      </div>
    </aside>

    <main class="stage" id="stage" tabindex="-1"></main>

  </div>


  <section class="prefs" id="prefs" role="dialog" aria-label="Réglages" hidden>
    <div class="prefs-head">
      <h2 class="prefs-title">Réglages</h2>
      <button type="button" class="prefs-close" id="prefs-close" aria-label="Fermer les réglages">✕</button>
    </div>
    <div class="prefs-body">

      <fieldset class="pref-group">
        <legend>Thème</legend>
        <div class="seg">
          <label><input type="radio" name="theme" value="light"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Clair</span></label>
          <label><input type="radio" name="theme" value="dark"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>Sombre</span></label>
          <label><input type="radio" name="theme" value="auto"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>Auto</span></label>
        </div>
      </fieldset>

      <fieldset class="pref-group">
        <legend>Couleur du rail</legend>
        <div class="seg">
          <label><input type="radio" name="accent" value="ocean"><span class="sw" style="--sw:#1d3b4f">Océan</span></label>
          <label><input type="radio" name="accent" value="plum"><span class="sw" style="--sw:#3e2447">Prune</span></label>
          <label><input type="radio" name="accent" value="moss"><span class="sw" style="--sw:#233d2b">Mousse</span></label>
        </div>
      </fieldset>

      <fieldset class="pref-group">
        <legend>Taille du texte</legend>
        <div class="seg">
          <label><input type="radio" name="size" value="s"><span>Petit</span></label>
          <label><input type="radio" name="size" value="m"><span>Normal</span></label>
          <label><input type="radio" name="size" value="l"><span>Grand</span></label>
        </div>
      </fieldset>

      <label class="pref-switch"><span>Grain de papier</span><input type="checkbox" name="grain" role="switch"></label>
      <label class="pref-switch"><span>Animations</span><input type="checkbox" name="motion" role="switch"></label>

      <fieldset class="pref-group">
        <legend>Sauvegarde</legend>
        <div class="pref-data">
          <button type="button" class="prefs-reset" data-p="export">Exporter</button>
          <button type="button" class="prefs-reset" data-p="import">Importer</button>
        </div>
        <p class="pref-hint">Scores et pronostics sont stockés dans ce navigateur uniquement : exporte de temps en temps.</p>
        <input type="file" id="data-import-file" accept="application/json,.json" hidden>
      </fieldset>

      <dl class="prefs-keys">
        <dt><kbd>/</kbd></dt><dd>Chercher un événement</dd>
        <dt><kbd>T</kbd></dt><dd>Clair / sombre</dd>
        <dt><kbd>,</kbd></dt><dd>Ouvrir les réglages</dd>
        <dt><kbd>Échap</kbd></dt><dd>Fermer</dd>
      </dl>

      <button type="button" class="prefs-reset" id="prefs-reset">Rétablir les réglages</button>
    </div>
  </section>

  <button type="button" class="admin-fab" id="admin-fab" hidden>+ Event</button>

  <div id="admin-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-action="admin-close"></div>
    <div class="modal-panel admin-panel" role="dialog" aria-modal="true" aria-label="Générateur d'événement">
      <div class="modal-head">
        <h2>Générateur d'événement</h2>
        <button type="button" class="modal-close" data-action="admin-close" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body" id="admin-body"></div>
    </div>
  </div>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Aperçu de l'image" aria-hidden="true">
    <button id="viewer-close" type="button" aria-label="Fermer (Échap)">✕</button>

    <figure class="viewer-figure">
      <img id="viewer-img" src="" alt="">
    </figure>

    <figcaption id="viewer-caption" aria-live="polite"></figcaption>

    <nav class="viewer-nav" aria-label="Navigation entre les images">
      <button class="viewer-btn" id="viewer-prev" type="button" aria-label="Image précédente (←)">←</button>
      <span class="viewer-count" id="viewer-count" aria-live="polite" aria-atomic="true"></span>
      <button class="viewer-btn" id="viewer-next" type="button" aria-label="Image suivante (→)">→</button>
    </nav>
  </div>

  <script src="theme.js?v=6" defer></script>
  <script src="events/2025.js?v=3" defer></script>
  <script src="events/2026.js?v=3" defer></script>
  <script src="events/2027.js?v=3" defer></script>
  <script src="id.js?v=3" defer></script>
  <script src="predict.js?v=1" defer></script>
  <script src="data.js?v=4" defer></script>
</body>
</html>
