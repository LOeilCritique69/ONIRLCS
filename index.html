<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OniRLCS — Carnet de pronostics RLCS</title>
  <meta name="description" content="Carnet de pronostics RLCS d'Oni : score par événement, pronostic vs résultat, saisons 2025–2026.">
  <meta name="author" content="Yanis (Oni)">
  <meta name="theme-color" content="#0a0c12">

  <meta property="og:type" content="website">
  <meta property="og:title" content="OniRLCS — Carnet de pronostics">
  <meta property="og:description" content="Pronostics RLCS 2025–2026, événement par événement.">
  <meta property="og:image" content="/img/og-preview.png">
  <meta property="og:locale" content="fr_FR">

  <link rel="icon" type="image/png" sizes="32x32" href="/img/worlds2025.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/worlds2025.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <a class="skip-link" href="#stage">Aller au contenu</a>

  <header class="mobile-bar">
    <button type="button" class="mobile-toggle" id="mobile-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="rail">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-bar-title">Oni<span>RLCS</span></span>
  </header>
  <div class="rail-backdrop" id="rail-backdrop" hidden></div>

  <div class="app-shell">

    <header class="rail" id="rail" role="banner">
      <button type="button" class="rail-brand rail-brand-link" id="home-link" aria-label="Accueil — vue d'ensemble">
        <p class="rail-kicker" aria-hidden="true">Rocket League Championship Series</p>
        <h1 class="rail-name">Oni<span>RLCS</span></h1>
        <p class="rail-sub">Carnet de pronostics — 2025 → 2026</p>
      </button>

      <div class="rail-ticker" id="rail-ticker" aria-label="Statistiques globales"></div>

      <div class="season-switch" role="group" aria-label="Choisir la saison">
        <button type="button" class="season-opt" data-season="2025" aria-pressed="true">2025</button>
        <button type="button" class="season-opt" data-season="2026" aria-pressed="false">2026</button>
      </div>

      <div class="rail-search">
        <input type="search" id="event-search" class="rail-search-input" placeholder="Rechercher un événement…" aria-label="Rechercher un événement">
      </div>

      <nav class="event-list" id="event-list" aria-label="Événements de la saison"></nav>
    </header>

    <main class="stage" id="stage" tabindex="-1"></main>

  </div>

  <button type="button" class="admin-fab" id="admin-fab" hidden>+ Event</button>

  <div id="admin-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-action="admin-close"></div>
    <div class="modal-panel admin-panel" role="dialog" aria-modal="true" aria-label="Générateur d'événement">
      <div class="modal-head">
        <h2>Générateur d'événement</h2>
        <button type="button" class="modal-close" data-action="admin-close" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body" id="admin-body"></div>
    </div>
  </div>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Aperçu de l'image" aria-hidden="true">
    <button id="viewer-close" type="button" aria-label="Fermer (Échap)">✕</button>

    <figure class="viewer-figure">
      <img id="viewer-img" src="" alt="">
    </figure>

    <figcaption id="viewer-caption" aria-live="polite"></figcaption>

    <nav class="viewer-nav" aria-label="Navigation entre les images">
      <button class="viewer-btn" id="viewer-prev" type="button" aria-label="Image précédente (←)">←</button>
      <span class="viewer-count" id="viewer-count" aria-live="polite" aria-atomic="true"></span>
      <button class="viewer-btn" id="viewer-next" type="button" aria-label="Image suivante (→)">→</button>
    </nav>
  </div>

  <script src="id.js?v=3" defer></script>
  <script src="data.js?v=3" defer></script>
</body>
</html>
